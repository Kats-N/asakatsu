<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#1f4d38">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>朝活コーチ</title>
<style>
  :root {
    --green: #2f6f4f; --green-d: #1f4d38; --green-l: #eaf3ee;
    --ink: #22303a; --sub: #64748b; --card: #ffffff;
    --amber: #b45309; --red: #c0492f; --blue: #1d6fa5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: linear-gradient(160deg, #f2f7f4 0%, #e8f0ea 100%);
    color: var(--ink); min-height: 100vh; font-size: 16px; line-height: 1.6;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 18px 40px; }
  .screen { display: none; animation: fade .35s ease; }
  .screen.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  h1 { font-size: 22px; color: var(--green-d); margin: 4px 0 2px; }
  .date { color: var(--sub); font-size: 14px; margin-bottom: 18px; }
  .q { font-size: 19px; font-weight: 700; color: var(--green-d); margin: 24px 0 14px; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    background: var(--card); border: 2px solid #d8e3dc; border-radius: 14px;
    padding: 16px 18px; font-size: 17px; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 12px; width: 100%;
    transition: border-color .15s, transform .1s;
  }
  .opt:active { transform: scale(.98); border-color: var(--green); }
  .opt .emoji { font-size: 24px; }
  .opt small { display: block; color: var(--sub); font-size: 13px; }
  .opt.compact { padding: 12px 16px; font-size: 15px; }
  .card {
    background: var(--card); border-radius: 16px; padding: 18px;
    box-shadow: 0 2px 10px rgba(31,77,56,.08); margin-bottom: 14px;
  }
  .card h2 { font-size: 15px; color: var(--green); margin: 0 0 8px; }
  .menu-item { padding: 9px 0; border-bottom: 1px dashed #e2e8f0; display: flex; gap: 10px; align-items: baseline; }
  .menu-item:last-child { border-bottom: none; }
  .menu-item .n { color: var(--green); font-weight: 700; min-width: 1.3em; }
  .hero {
    background: linear-gradient(135deg, var(--green-d), var(--green));
    color: #fff; border-radius: 16px; padding: 18px; margin-bottom: 14px;
  }
  .hero .place { font-size: 13px; opacity: .85; letter-spacing: .1em; }
  .hero .title { font-size: 21px; font-weight: 800; margin: 2px 0 6px; }
  .hero .lvl { display:inline-block; background:rgba(255,255,255,.2); border-radius:20px; padding:1px 10px; font-size:12px; margin-bottom:6px; }
  .hero .msg { font-size: 14px; opacity: .95; }
  .done-banner {
    background: #eaf6ef; border: 2px solid var(--green); color: var(--green-d);
    border-radius: 14px; padding: 12px 16px; font-weight: 700; font-size: 15px;
    margin-bottom: 14px; text-align: center;
  }
  .note { border-left: 4px solid var(--amber); background: #fdf6ec; border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; }
  .note.blue { border-color: var(--blue); background: #eff6fc; }
  .note.red { border-color: var(--red); background: #fdf1ee; }
  .note b { color: var(--green-d); }
  .btn {
    display: block; width: 100%; background: var(--green); color: #fff;
    border: none; border-radius: 14px; padding: 16px; font-size: 17px;
    font-weight: 700; cursor: pointer; margin-top: 10px;
  }
  .btn.ghost { background: #fff; color: var(--green); border: 2px solid var(--green); }
  .btn.sub { background: #fff; color: var(--sub); border: 2px solid #d8e3dc; font-size: 15px; padding: 12px; }
  .btn:active { opacity: .85; }
  .hist { background: #fff; border-radius: 12px; padding: 4px 14px; margin-bottom: 14px; }
  .hist-item { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px dashed #e2e8f0; font-size: 14px; }
  .hist-item:last-child { border-bottom: none; }
  .hist-item .d { color: var(--sub); font-size: 12px; min-width: 4.5em; }
  .hist-title { font-size: 13px; color: var(--sub); margin: 0 0 2px; font-weight: 700; }
  .progress { display: flex; gap: 6px; margin-bottom: 6px; }
  .progress span { height: 5px; flex: 1; border-radius: 3px; background: #d8e3dc; }
  .progress span.on { background: var(--green); }
</style>
</head>
<body>
<div class="wrap">

  <!-- START -->
  <div class="screen active" id="s0">
    <h1 id="greeting">おはようございます 🌅</h1>
    <div class="date" id="dateLabel"></div>
    <div id="histBox0"></div>
    <div class="card">
      <h2>今日のあなたに合わせてメニューを組みます</h2>
      <div style="font-size:14px;color:var(--sub)">3つ答えるだけ。30秒で終わります。</div>
    </div>
    <button class="btn" onclick="go(1)">はじめる</button>
    <button class="btn sub" onclick="go(6)">一覧から自分で選ぶ</button>
  </div>

  <!-- Q1 wake -->
  <div class="screen" id="s1">
    <div class="progress"><span class="on"></span><span></span><span></span></div>
    <div class="q">目覚めはどうですか？</div>
    <div class="opts">
      <button class="opt" onclick="ans('wake',3)"><span class="emoji">😊</span><span>スッキリ<small>よく眠れた・体が軽い</small></span></button>
      <button class="opt" onclick="ans('wake',2)"><span class="emoji">😐</span><span>ふつう<small>いつも通り</small></span></button>
      <button class="opt" onclick="ans('wake',1)"><span class="emoji">🥱</span><span>イマイチ<small>眠い・重い・疲れが残っている</small></span></button>
    </div>
  </div>

  <!-- Q2 load -->
  <div class="screen" id="s2">
    <div class="progress"><span class="on"></span><span class="on"></span><span></span></div>
    <div class="q">今日の仕事・予定の負荷は？</div>
    <div style="font-size:13px;color:var(--sub);margin:-8px 0 12px">高稼働の日は、運動でスイッチを入れて臨みます（寝不足のときは自動で軽くします）。</div>
    <div class="opts">
      <button class="opt" onclick="ans('load',1)"><span class="emoji">🟢</span><span>軽め<small>余裕がある日</small></span></button>
      <button class="opt" onclick="ans('load',2)"><span class="emoji">🟡</span><span>ふつう<small>通常運転</small></span></button>
      <button class="opt" onclick="ans('load',3)"><span class="emoji">🔴</span><span>重い<small>会議・締切・気を張る日 → しっかり動いて臨む</small></span></button>
    </div>
  </div>

  <!-- Q3 weather -->
  <div class="screen" id="s3">
    <div class="progress"><span class="on"></span><span class="on"></span><span class="on"></span></div>
    <div class="q">今朝の天気は？</div>
    <div class="opts">
      <button class="opt" onclick="ans('rain',false)"><span class="emoji">☀️</span><span>晴れ・くもり<small>外に出られる</small></span></button>
      <button class="opt" onclick="ans('rain',true)"><span class="emoji">🌧</span><span>雨<small>今日は家で完結</small></span></button>
    </div>
  </div>

  <!-- TODAY / RESULT -->
  <div class="screen" id="s4">
    <div id="doneBanner" style="display:none" class="done-banner">✅ 今日のメニューはセット済み</div>
    <div class="hero">
      <div class="place" id="rPlace"></div>
      <div class="title" id="rTitle"></div>
      <div><span class="lvl" id="rLvl"></span></div>
      <div class="msg" id="rMsg"></div>
    </div>
    <div id="rNotes"></div>
    <div class="card">
      <h2>今日のメニュー</h2>
      <div id="rMenu"></div>
    </div>
    <div class="card">
      <h2>毎朝の固定ブロック</h2>
      <div class="menu-item"><span class="n">前</span><span>プレハブ3〜4分：片脚カーフレイズ各15×2／足首壁ドリル各10／レッグスイング各10</span></div>
      <div class="menu-item"><span class="n">後</span><span>水シャワー2分 → 瞑想10分</span></div>
    </div>
    <div id="histBox4"></div>
    <div id="confirmBtns">
      <button class="btn" onclick="finish()">このメニューでやる 💪</button>
      <button class="btn ghost" onclick="go(1)">質問に答え直す</button>
      <button class="btn sub" onclick="go(6)">一覧から選び直す</button>
    </div>
    <div id="doneBtns" style="display:none">
      <button class="btn sub" onclick="go(6)">メニューを変更する（一覧から）</button>
      <button class="btn sub" onclick="go(1)">質問に答え直す</button>
    </div>
  </div>

  <!-- MANUAL PICK -->
  <div class="screen" id="s6">
    <div class="q">今日のメニューを選ぶ</div>
    <div style="font-size:13px;color:var(--sub);margin-bottom:12px">体調や事情に合わせて自由に。休むのも立派な選択です。</div>
    <div class="opts" id="repList"></div>
    <button class="btn sub" onclick="go(0)" style="margin-top:14px">戻る</button>
  </div>

</div>

<script>
"use strict";
const state = { wake: 2, load: 2, rain: false };
const today = new Date();
const todayStr = today.toISOString().slice(0, 10);
const dow = today.getDay(); // 0=Sun
const DAYS = ["日","月","火","水","木","金","土"];
const K_TODAY = "asakatsu_today";
const K_HIST = "asakatsu_history";
const LVL_NAME = ["最小", "軽め", "標準", "ハード"];

// ---- 週次テンプレ（v4：ジム週4・木/日は回復補正あり）----
// cat: strength / cardio / light
const TEMPLATE = {
  1: { cat:"strength", place:"ジム", title:"筋力デー" },
  2: { cat:"cardio",   place:"外",   title:"イージーデー" },
  3: { cat:"light",    place:"家周辺", title:"最軽量デー" },
  4: { cat:"strength", place:"ジム", title:"筋力デー（断食明け）", fasting:true },
  5: { cat:"strength", place:"ジム", title:"筋力デー" },
  6: { cat:"cardio",   place:"外",   title:"持久ランデー", endurance:true },
  0: { cat:"strength", place:"ジム", title:"筋力デー（週末）" }
};

const HOME_A = ["プッシュアップ 15×3","自重スクワット 20×3","グッドモーニング 15×3","※3秒かけて下ろすテンポで負荷を出す"];
const HOME_B = ["自重タバタ 4分","スクワット 3分","プッシュアップ 3分"];

// ---- レベル→メニュー ----
function strengthMenu(level, fasting) {
  const warm = fasting ? "トレッドミル歩き 12〜15分（血圧を立ち上げる）" : "トレッドミル歩き 10分";
  if (level <= 0) return ["ジムは軽く or 自宅タバタ 4分","無理なら休養＋モビリティ", fasting ? "電解質と水を先に" : ""].filter(Boolean);
  const sets = level >= 2 ? "15×3" : "15×2";
  const m = [warm, `チェストプレス 45kg ${sets}`, `スクワットマシン 60kg ${sets}`, `ラットプルダウン 45kg ${sets}`];
  if (level >= 3) m.push("最終セットは丁寧に追い込み");
  if (fasting) m.push("断食明け：しんどければ即中断。無理は禁物");
  return m;
}
function cardioMenu(level, endurance) {
  if (level <= 0) return ["早歩き 15〜20分 or 休養"];
  if (level === 1) return ["早歩き or 会話ペースの軽ジョグ 20〜25分"];
  if (level === 2) return endurance ? ["イージーラン（ゆっくり長め可）","今週の持久ベース"] : ["イージーラン（ゆっくり長め可）"];
  return ["ラン（少し長め or 速め、+1kmまで）","怪我予防優先。脚に違和感があれば即歩きに"];
}
function lightMenu(level) {
  if (level <= 0) return ["室内モビリティ＋瞑想のみ"];
  return ["早歩き 15分","瞑想を長めに（15分〜）"];
}

// ---- レベル計算（v4ロジック）----
function calcLevel() {
  let level = 2; // 基準＝テンプレ標準
  // 1. 安全弁（睡眠・エネルギー）
  if (state.wake === 1) level -= 1;
  if (state.wake === 3 && state.load <= 2) level += 1;
  // 2. アクセル（稼働）— 寝不足なら効かない
  if (state.load === 3 && state.wake >= 2) level += 1;
  // 3. 曜日の生理補正
  if (dow === 4) level -= 1;               // 断食明け木曜
  if (dow === 0) level -= 1;               // 週末日曜（回復・飲酒明け配慮）
  if (dow === 3) level = Math.min(level, 1); // 水曜断食＋会議
  return Math.max(0, Math.min(3, level));
}

// ---- メニュー決定 ----
function buildPlan() {
  const base = TEMPLATE[dow];
  const level = calcLevel();
  let place = base.place, title = base.title, menu;

  if (state.rain) {
    place = "家";
    if (base.cat === "strength") menu = level <= 0 ? [...HOME_B] : HOME_A.map(m => level === 1 ? m.replace("×3","×2") : m);
    else if (base.cat === "cardio") menu = [...HOME_B];
    else menu = ["室内モビリティ 10分","瞑想を長めに"];
    title += "（雨・自宅）";
  } else {
    if (base.cat === "strength") menu = strengthMenu(level, base.fasting);
    else if (base.cat === "cardio") menu = cardioMenu(level, base.endurance);
    else menu = lightMenu(level);
  }

  return { date: todayStr, place, title, menu, level, msg: pickMsg(level, base), done: false };
}

function pickMsg(level, base) {
  if (base.fasting) return "断食明けの朝。エネルギーと血圧が低い前提で、ウォームアップ長め・無理は禁物です。";
  if (state.wake === 1) return "寝不足の朝は軽くして正解。回復も立派なトレーニングです。";
  if (state.load === 3 && level >= 2) return "重い一日。運動でスイッチを入れて、良い状態で仕事へ。💪";
  if (level >= 3) return "コンディション良好。今日は少し攻めてOK（怪我予防だけは優先）。";
  if (dow === 0) return "週末は回復寄りに。淡々と積み上げる日です。";
  return CHEERS[Math.floor(Math.random() * CHEERS.length)];
}

const CHEERS = [
  "4時半に起きている時点で、もう上位1%です。",
  "今日も「続けている自分」に一票入れましょう。",
  "完璧じゃなくていい。続くことが最強です。",
  "昨日の自分より1mm前へ。それで十分。",
  "この積み重ねが、仕事の集中力を作っています。"
];

// ---- 曜日イベントの注意書き ----
function specialNotes() {
  const notes = [];
  if (dow === 3) notes.push({cls:"", text:"🍵 <b>今日はファスティングデー。</b>空腹は「効いてる」サイン。コーヒーとサプリで整えつつ、会議も乗り切りましょう。"});
  if (dow === 4) notes.push({cls:"", text:"🍽 <b>断食明けの朝。</b>糖質が枯れています。運動前に少し水分・電解質を。物足りなくても今日はこれで十分。"});
  if ([2,6,0].includes(dow)) notes.push({cls:"red", text:"🍺 <b>飲酒明けの可能性がある朝。</b>飲んだ翌朝なら「目覚めイマイチ」を選べば自動で軽くなります。まず水をコップ1杯。"});
  if ([1,5,6].includes(dow)) notes.push({cls:"blue", text:"🌙 <b>今夜は晩酌OKの日。</b>飲む前に水500ml／就寝3時間前までに切り上げ／量は気持ちよく話せる範囲まで。"});
  return notes;
}

// ---- 保存・履歴 ----
function getHist() { return JSON.parse(localStorage.getItem(K_HIST) || "[]"); }
function getToday() {
  const t = JSON.parse(localStorage.getItem(K_TODAY) || "null");
  return (t && t.date === todayStr) ? t : null;
}
function saveToday(plan) { localStorage.setItem(K_TODAY, JSON.stringify(plan)); }
function saveHist(plan) {
  let hist = getHist().filter(h => h.date !== todayStr);
  const ran = /ラン|ジョグ/.test(plan.menu.join()) && !/走らなくてOK|歩き/.test(plan.menu.join());
  hist.push({ date: todayStr, day: DAYS[dow], title: plan.title, ran });
  localStorage.setItem(K_HIST, JSON.stringify(hist.slice(-60)));
}

// ---- 手動選択レパートリー ----
const REPERTOIRE = [
  { emoji:"🏋️", place:"ジム", title:"筋力フル", menu:["トレッドミル歩き 10分","チェストプレス 45kg 15×3","スクワットマシン 60kg 15×3","ラットプルダウン 45kg 15×3"] },
  { emoji:"🏋️", place:"ジム", title:"筋力（軽め・断食明け向き）", menu:["トレッドミル歩き 12〜15分","筋トレ3種 各15×2","無理なら中断・電解質"] },
  { emoji:"🏃", place:"外", title:"イージーラン", menu:["イージーラン（ゆっくり長め可）"] },
  { emoji:"🏃", place:"外", title:"ラン（攻め）", menu:["ラン（少し長め or 速め、+1kmまで）","怪我予防だけは優先"] },
  { emoji:"🚶", place:"外", title:"早歩き・軽ジョグ", menu:["早歩き or 会話ペースの軽ジョグ 20〜25分"] },
  { emoji:"🧘", place:"家周辺", title:"最軽量（歩き＋瞑想）", menu:["早歩き 15分","瞑想を長めに（15分〜）"] },
  { emoji:"💪", place:"家", title:"自宅A（筋力サーキット）", menu: HOME_A },
  { emoji:"🔥", place:"家", title:"自宅B（有酸素サーキット）", menu: HOME_B },
  { emoji:"⏱", place:"家", title:"最小（タバタのみ）", menu:["自宅タバタ 4分だけでOK","＋プレハブは必ず"] },
  { emoji:"🛌", place:"家", title:"完全休養", menu:["今日は休む。それも計画のうち","やるなら軽いモビリティ・ストレッチだけ","水分補給をしっかり"] }
];

// ---- UI ----
let currentPlan = null;

function go(n) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("s" + n).classList.add("active");
  window.scrollTo(0, 0);
  if (n === 0) init();
  if (n === 6) renderRepertoire();
}
function ans(key, val) {
  state[key] = val;
  if (key === "wake") go(2);
  else if (key === "load") go(3);
  else showPlan(buildPlan());
}
function showPlan(plan) {
  currentPlan = plan;
  saveToday(plan);
  document.getElementById("rPlace").textContent = "📍 " + plan.place;
  document.getElementById("rTitle").textContent = DAYS[dow] + "曜｜" + plan.title;
  document.getElementById("rLvl").textContent = "強度：" + (LVL_NAME[plan.level] || "標準");
  document.getElementById("rMsg").textContent = plan.msg;
  document.getElementById("rMenu").innerHTML = plan.menu
    .map((m, i) => `<div class="menu-item"><span class="n">${i + 1}</span><span>${m}</span></div>`).join("");
  document.getElementById("rNotes").innerHTML = specialNotes()
    .map(n => `<div class="note ${n.cls}">${n.text}</div>`).join("");
  document.getElementById("doneBanner").style.display = plan.done ? "block" : "none";
  document.getElementById("confirmBtns").style.display = plan.done ? "none" : "block";
  document.getElementById("doneBtns").style.display = plan.done ? "block" : "none";
  renderHist("histBox4");
  go(4);
}
function finish() {
  currentPlan.done = true;
  currentPlan.msg = "決めたら迷わない。あとは体を動かすだけ！🔥";
  saveToday(currentPlan);
  saveHist(currentPlan);
  showPlan(currentPlan);
}
function pickManual(i) {
  const r = REPERTOIRE[i];
  showPlan({ date: todayStr, place: r.place, title: r.title, menu: [...r.menu],
    level: 2, msg: CHEERS[Math.floor(Math.random() * CHEERS.length)], done: false });
}
function renderRepertoire() {
  document.getElementById("repList").innerHTML = REPERTOIRE
    .map((r, i) => `<button class="opt compact" onclick="pickManual(${i})"><span class="emoji">${r.emoji}</span><span><b>${r.title}</b><small>📍 ${r.place}</small></span></button>`).join("");
}
function renderHist(boxId) {
  const box = document.getElementById(boxId);
  const items = getHist().filter(h => h.date !== todayStr).slice(-3).reverse();
  if (!items.length) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="hist"><p class="hist-title" style="padding-top:8px">最近の記録 ✅</p>` +
    items.map(h => `<div class="hist-item"><span class="d">${h.date.slice(5).replace("-","/")} ${h.day}</span><span>${h.title}</span></div>`).join("") + `</div>`;
}

function init() {
  const h = today.getHours();
  document.getElementById("greeting").textContent =
    h < 10 ? "おはようございます 🌅" : h < 18 ? "こんにちは ☀️" : "こんばんは 🌙";
  document.getElementById("dateLabel").textContent =
    `${today.getMonth() + 1}月${today.getDate()}日（${DAYS[dow]}）`;
  renderHist("histBox0");
}

init();
const saved = getToday();
if (saved) showPlan(saved);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
