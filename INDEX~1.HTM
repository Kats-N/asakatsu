<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#1f4d38">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>朝活コーチ</title>
<style>
  :root {
    --green: #2f6f4f; --green-d: #1f4d38; --green-l: #eaf3ee;
    --ink: #22303a; --sub: #64748b; --card: #ffffff;
    --amber: #b45309; --red: #c0492f; --blue: #1d6fa5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: linear-gradient(160deg, #f2f7f4 0%, #e8f0ea 100%);
    color: var(--ink); min-height: 100vh; font-size: 16px; line-height: 1.6;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 18px 40px; }
  .screen { display: none; animation: fade .35s ease; }
  .screen.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  h1 { font-size: 22px; color: var(--green-d); margin: 4px 0 2px; }
  .date { color: var(--sub); font-size: 14px; margin-bottom: 18px; }
  .q { font-size: 19px; font-weight: 700; color: var(--green-d); margin: 24px 0 14px; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    background: var(--card); border: 2px solid #d8e3dc; border-radius: 14px;
    padding: 16px 18px; font-size: 17px; text-align: left; cursor: pointer;
    display: flex; align-items: center; gap: 12px; width: 100%;
    transition: border-color .15s, transform .1s;
  }
  .opt:active { transform: scale(.98); border-color: var(--green); }
  .opt .emoji { font-size: 24px; }
  .opt small { display: block; color: var(--sub); font-size: 13px; }
  .card {
    background: var(--card); border-radius: 16px; padding: 18px;
    box-shadow: 0 2px 10px rgba(31,77,56,.08); margin-bottom: 14px;
  }
  .card h2 { font-size: 15px; color: var(--green); margin: 0 0 8px; }
  .menu-item { padding: 9px 0; border-bottom: 1px dashed #e2e8f0; display: flex; gap: 10px; align-items: baseline; }
  .menu-item:last-child { border-bottom: none; }
  .menu-item .n { color: var(--green); font-weight: 700; min-width: 1.3em; }
  .hero {
    background: linear-gradient(135deg, var(--green-d), var(--green));
    color: #fff; border-radius: 16px; padding: 18px; margin-bottom: 14px;
  }
  .hero .place { font-size: 13px; opacity: .85; letter-spacing: .1em; }
  .hero .title { font-size: 21px; font-weight: 800; margin: 2px 0 6px; }
  .hero .msg { font-size: 14px; opacity: .95; }
  .note { border-left: 4px solid var(--amber); background: #fdf6ec; border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 14px; margin-bottom: 12px; }
  .note.blue { border-color: var(--blue); background: #eff6fc; }
  .note.red { border-color: var(--red); background: #fdf1ee; }
  .note b { color: var(--green-d); }
  .btn {
    display: block; width: 100%; background: var(--green); color: #fff;
    border: none; border-radius: 14px; padding: 16px; font-size: 17px;
    font-weight: 700; cursor: pointer; margin-top: 10px;
  }
  .btn.ghost { background: #fff; color: var(--green); border: 2px solid var(--green); }
  .btn:active { opacity: .85; }
  .yesterday { font-size: 13px; color: var(--sub); background: #fff; border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; }
  .progress { display: flex; gap: 6px; margin-bottom: 6px; }
  .progress span { height: 5px; flex: 1; border-radius: 3px; background: #d8e3dc; }
  .progress span.on { background: var(--green); }
  .cheer { text-align: center; font-size: 15px; color: var(--green-d); font-weight: 600; margin: 14px 0 4px; }
  .done-icon { text-align: center; font-size: 56px; margin: 30px 0 10px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- START -->
  <div class="screen active" id="s0">
    <h1 id="greeting">おはようございます 🌅</h1>
    <div class="date" id="dateLabel"></div>
    <div class="yesterday" id="yesterdayBox" style="display:none"></div>
    <div class="card">
      <h2>今日のあなたに合わせてメニューを組みます</h2>
      <div style="font-size:14px;color:var(--sub)">3つ答えるだけ。30秒で終わります。</div>
    </div>
    <button class="btn" onclick="go(1)">はじめる</button>
  </div>

  <!-- Q1 wake -->
  <div class="screen" id="s1">
    <div class="progress"><span class="on"></span><span></span><span></span></div>
    <div class="q">目覚めはどうですか？</div>
    <div class="opts">
      <button class="opt" onclick="ans('wake',3)"><span class="emoji">😊</span><span>スッキリ<small>よく眠れた・体が軽い</small></span></button>
      <button class="opt" onclick="ans('wake',2)"><span class="emoji">😐</span><span>ふつう<small>いつも通り</small></span></button>
      <button class="opt" onclick="ans('wake',1)"><span class="emoji">🥱</span><span>イマイチ<small>眠い・重い・疲れが残っている</small></span></button>
    </div>
  </div>

  <!-- Q2 load -->
  <div class="screen" id="s2">
    <div class="progress"><span class="on"></span><span class="on"></span><span></span></div>
    <div class="q">今日の仕事・予定の負荷は？</div>
    <div class="opts">
      <button class="opt" onclick="ans('load',1)"><span class="emoji">🟢</span><span>軽め<small>余裕がある日</small></span></button>
      <button class="opt" onclick="ans('load',2)"><span class="emoji">🟡</span><span>ふつう<small>通常運転</small></span></button>
      <button class="opt" onclick="ans('load',3)"><span class="emoji">🔴</span><span>重い<small>会議・締切・気を張る日</small></span></button>
    </div>
  </div>

  <!-- Q3 weather -->
  <div class="screen" id="s3">
    <div class="progress"><span class="on"></span><span class="on"></span><span class="on"></span></div>
    <div class="q">今朝の天気は？</div>
    <div class="opts">
      <button class="opt" onclick="ans('rain',false)"><span class="emoji">☀️</span><span>晴れ・くもり<small>外に出られる</small></span></button>
      <button class="opt" onclick="ans('rain',true)"><span class="emoji">🌧</span><span>雨<small>今日は家で完結</small></span></button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="s4">
    <div class="hero">
      <div class="place" id="rPlace"></div>
      <div class="title" id="rTitle"></div>
      <div class="msg" id="rMsg"></div>
    </div>
    <div id="rNotes"></div>
    <div class="card">
      <h2>今日のメニュー</h2>
      <div id="rMenu"></div>
    </div>
    <div class="card">
      <h2>毎朝の固定ブロック</h2>
      <div class="menu-item"><span class="n">前</span><span>プレハブ3〜4分：片脚カーフレイズ各15×2／足首壁ドリル各10／レッグスイング各10</span></div>
      <div class="menu-item"><span class="n">後</span><span>水シャワー2分 → 瞑想10分</span></div>
    </div>
    <button class="btn" onclick="finish()">このメニューでやる 💪</button>
    <button class="btn ghost" onclick="restart()">答え直す</button>
  </div>

  <!-- DONE -->
  <div class="screen" id="s5">
    <div class="done-icon">🔥</div>
    <div class="cheer" id="doneCheer"></div>
    <div class="card" style="text-align:center;font-size:14px;color:var(--sub)">
      記録しました。行ってらっしゃい！<br>今日の積み上げが、1年後のあなたを作ります。
    </div>
    <button class="btn ghost" onclick="restart()">最初に戻る</button>
  </div>

</div>

<script>
"use strict";
const state = { wake: 2, load: 2, rain: false };
const today = new Date();
const dow = today.getDay(); // 0=Sun
const DAYS = ["日","月","火","水","木","金","土"];

// ---- 週次テンプレ（v2設計）----
// type: strength(ジム筋力) / gymrun(ジム:ラン+筋トレ軽) / outdoor(外イージー) / lightest(最軽量) / recovery(回復)
const TEMPLATE = {
  1: { type:"strength", place:"ジム", title:"筋力デー",
       menu:["トレッドミル歩き 10分（ウォームアップ）","チェストプレス 45kg 15×3","スクワットマシン 60kg 15×3","ラットプルダウン 45kg 15×3"] },
  2: { type:"outdoor", place:"外", title:"イージーデー",
       menu:["早歩き or 会話ペースの軽ジョグ 20〜25分","低強度厳守。今日は「回復させながら動かす」日"] },
  3: { type:"lightest", place:"家周辺", title:"最軽量デー",
       menu:["早歩き 15分","瞑想を長めに（15分〜）"] },
  4: { type:"gymrun", place:"ジム", title:"本命ランデー",
       menu:["ラン 5km（今週の質の1本）","筋トレ3種 各15×2（軽め・フォーム重視）"] },
  5: { type:"strength", place:"ジム", title:"筋力デー",
       menu:["筋トレ3種 各15×3","余裕があれば傾斜ウォーク 15分"] },
  6: { type:"outdoor_run", place:"外", title:"イージーランデー",
       menu:["イージーラン（ゆっくり長め可）","家族の予定に合わせて時間は柔軟に"] },
  0: { type:"recovery", place:"家", title:"回復デー",
       menu:["自重タバタ 4分","スクワット 3分","プッシュアップ 3分","（または完全休養＋モビリティ10分）"] }
};

const HOME_A = ["プッシュアップ 15×3","自重スクワット 20×3","グッドモーニング 15×3","※3秒かけて下ろすテンポで負荷を出す"];
const HOME_B = ["自重タバタ 4分","スクワット 3分","プッシュアップ 3分"];
const MINIMAL = ["自宅タバタ 4分だけでOK","＋プレハブは必ず"];

const CHEERS = [
  "4時半に起きている時点で、もう上位1%です。",
  "今日も「続けている自分」に一票入れましょう。",
  "完璧じゃなくていい。続くことが最強です。",
  "昨日の自分より1mm前へ。それで十分。",
  "この積み重ねが、仕事の集中力を作っています。"
];
const DONE_CHEERS = [
  "決めたら迷わない。あとは体を動かすだけ！",
  "いい選択です。今日も淡々と積み上げましょう。",
  "スタートを切った人だけが積み上がる。ナイス判断！"
];

// ---- メッセージ（曜日イベント）----
function specialNotes() {
  const notes = [];
  if (dow === 3) notes.push({cls:"", text:"🍵 <b>今日はファスティングデー。</b>空腹は「効いてる」サイン。コーヒーとサプリで整えつつ、会議も乗り切りましょう。集中力はむしろ味方です。"});
  if ([2,6,0].includes(dow)) notes.push({cls:"red", text:"🍺 <b>飲酒明けの可能性がある朝。</b>飲んだ翌朝なら強度を1段落としてOK。まず水をコップ1杯から。"});
  if ([1,5,6].includes(dow)) notes.push({cls:"blue", text:"🌙 <b>今夜は晩酌OKの日。</b>ヒント：飲む前に水500ml／就寝3時間前までに切り上げ／量は「気持ちよく話せる範囲」まで。明朝の自分への仕送りです。"});
  return notes;
}

// ---- メニュー決定エンジン ----
function buildPlan() {
  const base = TEMPLATE[dow];
  let level = 2; // 2=標準
  if (state.wake === 1) level--;
  if (state.load === 3) level--;
  if (state.wake === 3 && state.load === 1) level++;
  // 水曜は絶対に上げない
  if (dow === 3) level = Math.min(level, 2);

  let place = base.place, title = base.title, menu = [...base.menu], msg = "";
  const isStrengthDay = ["strength","gymrun"].includes(base.type);
  const isCardioDay = ["outdoor","outdoor_run"].includes(base.type);

  // 雨 → 家に置換
  if (state.rain) {
    place = "家";
    if (isStrengthDay) { title += "（雨・自宅A）"; menu = [...HOME_A]; if (base.type==="gymrun") menu.push("※ランは無し。木曜の1本は土曜に質を寄せる"); }
    else if (isCardioDay) { title += "（雨・自宅B）"; menu = [...HOME_B]; }
    else if (base.type === "lightest") { title += "（雨）"; menu = ["室内モビリティ 10分","瞑想を長めに"]; }
    msg = "雨の日は迷わず家で完結。これも設計のうちです。";
  }

  // レベル調整
  if (level <= 0) {
    title = "最小デー"; place = "家"; menu = [...MINIMAL];
    msg = "今日は攻めない日。週にバッファはあるので、堂々と落としてOK。";
  } else if (level === 1) {
    if (isStrengthDay && !state.rain) { menu = menu.map(m => m.replace("15×3","15×2")); msg = "セットを1つ減らして質を優先。それで十分です。"; }
    if (isCardioDay && !state.rain) { menu = ["早歩き 20分（走らなくてOK）"]; msg = "今日は歩きで正解。持久力は逃げません。"; }
    if (base.type === "gymrun" && !state.rain) { menu = ["傾斜ウォーク or 軽ジョグ 20分","筋トレは各15×2のまま or 省略可"]; msg = "本命ランは無理しない。来週も木曜は来ます。"; }
  } else if (level >= 3) {
    if (isStrengthDay && !state.rain) msg = "コンディション良好。最終セットだけ丁寧に追い込んでみましょう。";
    else if (isCardioDay && !state.rain) msg = "調子が良い日。ただし+1kmまで。怪我予防が最優先です。";
    else msg = "良い状態。でも今日の設計は守るのが吉です。";
  }
  if (!msg) msg = CHEERS[Math.floor(Math.random() * CHEERS.length)];

  // 前日との連続負荷チェック
  const hist = JSON.parse(localStorage.getItem("asakatsu_history") || "[]");
  const last = hist[hist.length - 1];
  if (last && last.ran && (base.type === "gymrun" || base.type === "outdoor_run") && !state.rain && level <= 2) {
    menu.push("※昨日も走っています。脚に違和感があれば早歩きに置き換え");
  }
  return { place, title, menu, msg };
}

// ---- UI ----
function go(n) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("s" + n).classList.add("active");
  window.scrollTo(0, 0);
}
function ans(key, val) {
  state[key] = val;
  if (key === "wake") go(2);
  else if (key === "load") go(3);
  else { renderResult(); go(4); }
}
let currentPlan = null;
function renderResult() {
  currentPlan = buildPlan();
  document.getElementById("rPlace").textContent = "📍 " + currentPlan.place;
  document.getElementById("rTitle").textContent = DAYS[dow] + "曜｜" + currentPlan.title;
  document.getElementById("rMsg").textContent = currentPlan.msg;
  document.getElementById("rMenu").innerHTML = currentPlan.menu
    .map((m, i) => `<div class="menu-item"><span class="n">${i + 1}</span><span>${m}</span></div>`).join("");
  document.getElementById("rNotes").innerHTML = specialNotes()
    .map(n => `<div class="note ${n.cls}">${n.text}</div>`).join("");
}
function finish() {
  const hist = JSON.parse(localStorage.getItem("asakatsu_history") || "[]");
  const ran = /ラン|ジョグ/.test(currentPlan.menu.join()) && !/走らなくてOK/.test(currentPlan.menu.join());
  hist.push({ date: today.toISOString().slice(0, 10), day: DAYS[dow], title: currentPlan.title, ran, ...state });
  localStorage.setItem("asakatsu_history", JSON.stringify(hist.slice(-60)));
  document.getElementById("doneCheer").textContent = DONE_CHEERS[Math.floor(Math.random() * DONE_CHEERS.length)];
  go(5);
}
function restart() { go(0); init(); }

function init() {
  const h = today.getHours();
  document.getElementById("greeting").textContent =
    h < 10 ? "おはようございます 🌅" : h < 18 ? "こんにちは ☀️" : "こんばんは 🌙";
  document.getElementById("dateLabel").textContent =
    `${today.getMonth() + 1}月${today.getDate()}日（${DAYS[dow]}）`;
  const hist = JSON.parse(localStorage.getItem("asakatsu_history") || "[]");
  const last = hist[hist.length - 1];
  const box = document.getElementById("yesterdayBox");
  if (last && last.date !== today.toISOString().slice(0, 10)) {
    box.style.display = "block";
    box.innerHTML = `前回：${last.day}曜「${last.title}」を実施 ✅ ちゃんと続いています。`;
  } else { box.style.display = "none"; }
}
init();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
